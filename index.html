<style id="css">
:root{
  /* Bố cục: 3 mục (Hôm nay, Lịch, Chi tiêu); thẻ pastel mỗi phần một màu; 1 cột trên điện thoại, 2 cột trên iPad và máy tính */
  --bg:#FFF5FA; --ink:#4A3856; --muted:#8A7896; --line:#F1DCEA; --white:#FFFFFF;
  --pink:#FFDDEA; --pink-d:#E0588C;
  --mint:#D3F4E4; --mint-d:#2A9A6E;
  --sky:#D7EAFF; --sky-d:#3B7DD6;
  --lemon:#FFF2C4; --lemon-d:#A87900;
  --lilac:#E9DEFF; --lilac-d:#7A58D6;
  --peach:#FFE3D1; --peach-d:#CC6830;
  --navy:#E3E6FF; --navy-d:#4B55C8;
  --brand:#E0588C; --glass:rgba(255,255,255,.7); --tabbg:rgba(255,245,250,.9);
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--line) 1.5px, transparent 1.6px);
  background-size:22px 22px;
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 64px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:26px 24px 72px;gap:18px}
  .span2{grid-column:1 / -1}
}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2.1rem;font-weight:800;color:var(--brand)}
h2{font-size:1.3rem;font-weight:700;color:var(--cd)}
h3{font-size:1.05rem;font-weight:700;color:var(--cd)}
p{margin:0}
.muted{color:var(--muted);font-size:.875rem}
.card{--c:var(--white);--cd:var(--pink-d);background:var(--c);border-radius:22px;padding:18px;display:grid;gap:12px;align-content:start;box-shadow:0 4px 0 rgba(74,56,86,.06);min-width:0}
.pink{--c:var(--pink);--cd:var(--pink-d)}
.mint{--c:var(--mint);--cd:var(--mint-d)}
.sky{--c:var(--sky);--cd:var(--sky-d)}
.lemon{--c:var(--lemon);--cd:var(--lemon-d)}
.lilac{--c:var(--lilac);--cd:var(--lilac-d)}
.peach{--c:var(--peach);--cd:var(--peach-d)}
.navy{--c:var(--navy);--cd:var(--navy-d)}
.plain{--c:var(--white);--cd:var(--lilac-d);border:2px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .txt{display:grid;gap:2px;flex:1 1 220px;min-width:0}
.date{color:var(--lilac-d);font-weight:800;font-size:.9rem}
.quote{color:var(--muted);font-size:.95rem}
.ring{flex:none;position:relative;width:86px;height:86px}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--mint-d);font-variant-numeric:tabular-nums}
/* Thanh mục */
.tabs{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:8px;z-index:5;background:var(--tabbg);backdrop-filter:blur(6px);padding:6px;border-radius:99px;border:2px solid var(--line);justify-self:start}
.tabs a{text-decoration:none;font-weight:800;padding:6px 16px;border-radius:99px;color:var(--muted);font-size:.95rem}
.tabs a.on{background:var(--cd);color:var(--white)}
.tabs a.t1{--cd:var(--mint-d)} .tabs a.t2{--cd:var(--lilac-d)} .tabs a.t3{--cd:var(--peach-d)} .tabs a.t4{--cd:var(--sky-d)} .tabs a.t5{--cd:var(--lemon-d)} .tabs a.t6{--cd:var(--pink-d)} .tabs a.t7{--cd:var(--navy-d)} .tabs a.t8{--cd:#1F9AA8}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats3{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.stats3{grid-template-columns:1fr 1fr}}
.stat{border-radius:16px;padding:10px 12px;display:grid;background:var(--c);min-width:0}
.stat b{font-family:var(--display);font-size:1.4rem;line-height:1.15;color:var(--cd);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--glass);border-radius:14px;min-width:0}
.item .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.item.on .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--cd)}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--cd);background:var(--white);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--white)}
.check svg{opacity:0}
.check.on{background:var(--cd)}
.check.on svg{opacity:1}
.streak{font-size:.75rem;font-weight:800;color:var(--peach-d);background:var(--peach);padding:2px 8px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.del{flex:none;border:0;background:var(--white);color:var(--muted);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:1.1rem;line-height:1}
button,input,textarea,select{font:inherit;color:inherit}
.btn{border:0;background:var(--white);border-radius:99px;padding:8px 16px;cursor:pointer;font-weight:800;color:var(--cd);box-shadow:0 2px 0 rgba(74,56,86,.08)}
.btn.primary{background:var(--cd);color:var(--white)}
.btn.small{padding:4px 12px;font-size:.85rem}
.link{background:var(--white);border:0;color:var(--cd);font-weight:800;cursor:pointer;padding:4px 12px;border-radius:99px;font-size:.85rem}
form.add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=time],input[type=date],textarea{background:var(--white);border:2px solid transparent;border-radius:14px;padding:8px 12px;min-width:0}
input:focus,textarea:focus{border-color:var(--cd);outline:none}
form.add input[type=text]{flex:1 1 160px}
form.add input[type=number]{flex:0 1 130px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--lilac-d);outline-offset:2px}
/* Nước */
.cups{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;max-width:340px}
.cup{border:0;background:transparent;padding:2px;cursor:pointer;border-radius:10px}
.cup svg{width:100%;height:auto;display:block}
.big{font-family:var(--display);font-size:1.8rem;color:var(--cd);line-height:1;font-variant-numeric:tabular-nums;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips .lbl{font-size:.8rem;font-weight:700;color:var(--muted);margin-right:2px}
.chip{border:0;background:var(--glass);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--muted)}
.chip.on{background:var(--cd);color:var(--white)}
.nudge{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;width:min(92vw,420px);background:var(--sky);border:3px solid var(--white);border-radius:22px;padding:14px 16px;box-shadow:0 10px 30px rgba(59,125,214,.25);display:grid;gap:10px;--cd:var(--sky-d)}
.nudge p{font-weight:800;color:var(--sky-d);font-family:var(--display);font-size:1.15rem}
.nudge .row{justify-content:flex-start}
/* Giấc ngủ */
.sleepform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sleepform label{display:grid;gap:4px;font-weight:700;font-size:.85rem;color:var(--muted)}
.pill{display:inline-block;font-size:.78rem;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--white);color:var(--cd)}
.pill.warn{color:var(--pink-d)}
/* Tâm trạng */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{border:0;background:var(--glass);border-radius:16px;padding:8px 2px 6px;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted)}
.mood svg{width:40px;height:40px}
.mood.on{background:var(--white);color:var(--cd);box-shadow:0 0 0 3px var(--cd) inset}
/* Tuần */
.weekbox{overflow-x:auto}
table.week{border-collapse:separate;border-spacing:4px;width:100%;min-width:440px;font-size:.82rem}
.week th{font-weight:800;color:var(--muted);padding:2px;text-align:center}
.week th.hn{text-align:left}
.week th.today{color:var(--pink-d)}
.week td{text-align:center}
.week td.hn{text-align:left;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.week tr.special td.hn{color:var(--muted)}
.cell{width:28px;height:28px;border-radius:9px;border:0;background:var(--bg);cursor:pointer;padding:0}
.cell.on{background:var(--mint-d)}
.wnum{font-size:.75rem;font-weight:800;color:var(--sky-d);font-variant-numeric:tabular-nums}
.wnum.s{color:var(--navy-d)}
.mdot{display:inline-block;width:20px;height:20px;vertical-align:middle}
/* Hẹn giờ */
.timer{display:grid;justify-items:center;gap:10px;text-align:center}
.clock{font-family:var(--display);font-size:3.6rem;font-weight:800;color:var(--lilac-d);font-variant-numeric:tabular-nums;line-height:1}
.mode{font-size:.8rem;font-weight:800;padding:3px 12px;border-radius:999px;background:var(--white);color:var(--lilac-d)}
.mode.break{color:var(--mint-d)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row.left{justify-content:flex-start}
.toast{font-size:.9rem;color:var(--cd);font-weight:800;min-height:1.3em}
/* Mục tiêu, hũ tiết kiệm */
.goal{display:grid;gap:6px;padding:10px 12px;background:var(--glass);border-radius:14px}
.goal .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.goal .top .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.goal .cnt{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--lemon);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--peach-d),var(--pink-d));border-radius:99px}
.goal.done .bar i,.bar.ok i{background:var(--mint-d)}
.bar.over i{background:var(--pink-d)}
.step{width:30px;height:30px;border-radius:50%;border:0;background:var(--lemon);cursor:pointer;font-weight:800;color:var(--lemon-d)}
.jarform{display:flex;gap:6px;flex-wrap:wrap}
.jarform input{flex:1 1 120px;padding:6px 10px}
/* Nhật ký */
.jq{display:grid;gap:6px}
.jq label{font-weight:800;font-size:.92rem}
textarea{width:100%;min-height:70px;resize:vertical}
details{background:var(--glass);border-radius:14px;padding:8px 12px}
.past{display:grid;gap:6px}
summary{cursor:pointer;font-weight:800;font-size:.9rem;color:var(--pink-d)}
details p{margin-top:6px;font-size:.9rem;white-space:pre-wrap}
details p b{color:var(--muted);display:block;font-size:.78rem}
.status{font-size:.78rem;color:var(--muted);font-weight:600}
/* Lịch */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.navbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--white);color:var(--cd);font-weight:800;cursor:pointer;font-size:1.1rem}
.cds.cdrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cds.cdrow::-webkit-scrollbar{display:none}
.cds.cdrow .cd{flex:0 0 calc((100% - 50px)/6);min-width:118px;scroll-snap-align:start}
.cdsec .head{gap:8px}.cdsec .cdnavs{display:none;gap:6px;margin-left:auto}.cdsec.more .cdnavs{display:flex}.cdsec .cdnavs .navbtn{width:30px;height:30px;font-size:1rem}.cdsec .cdnavs .navbtn:disabled{opacity:.35;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dow{text-align:center;font-size:.75rem;font-weight:800;color:var(--muted)}
.day{aspect-ratio:1/1;border:0;border-radius:14px;background:var(--white);cursor:pointer;display:grid;align-content:space-between;justify-items:center;padding:5px 2px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;min-width:0}
.day.today{box-shadow:0 0 0 2px var(--pink-d) inset;color:var(--pink-d)}
.day.sel{background:var(--cd);color:var(--white)}
.day .dots{display:flex;gap:3px;min-height:7px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--pink-d)}
.day .dots i.h{background:var(--mint-d)}
.day.sel .dots i{background:var(--white)}
.blank{aspect-ratio:1/1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.ev{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--glass);border-radius:14px}
.ev .tm{font-weight:800;color:var(--cd);font-variant-numeric:tabular-nums;min-width:46px}
.ev .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
/* Chi tiêu */
.tx{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--glass);border-radius:14px}
.tx .info{flex:1;min-width:0;display:grid}
.tx .info b{font-weight:700;overflow-wrap:anywhere}
.tx .info span{font-size:.78rem;color:var(--muted)}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.out{color:var(--pink-d)} .amt.in{color:var(--mint-d)}
.catrow{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:.85rem;font-weight:700}
.catrow .bar{background:var(--glass)}
/* Bộ màu */
html[data-skin="bien"]{--bg:#F1F7FF;--line:#D3E4F7;--brand:#3B7DD6;--tabbg:rgba(241,247,255,.9)}
html[data-skin="matcha"]{--bg:#F2FAF3;--line:#D2EAD9;--brand:#2A9A6E;--tabbg:rgba(242,250,243,.9)}
html[data-skin="hoanghon"]{--bg:#FFF6EE;--line:#F5DECB;--brand:#CC6830;--tabbg:rgba(255,246,238,.9)}
html[data-skin="oaihuong"]{--bg:#F7F3FF;--line:#E2D8F5;--brand:#7A58D6;--tabbg:rgba(247,243,255,.9)}
/* Chế độ tối */
html[data-night="1"]{
  --bg:#1B1525; --ink:#EEE6F4; --muted:#A998B6; --line:#2F2642; --white:#2A2237;
  --pink:#3B2234; --pink-d:#FF9EC4; --mint:#1C392E; --mint-d:#7EE0B5;
  --sky:#1D2D45; --sky-d:#8EBCFF; --lemon:#38301E; --lemon-d:#F2D27A;
  --lilac:#2D2547; --lilac-d:#C4AFFF; --peach:#3D2A20; --peach-d:#FFB286;
  --navy:#242A4A; --navy-d:#AAB1FF; --brand:#FF9EC4;
  --glass:rgba(255,255,255,.06); --tabbg:rgba(27,21,37,.9); color-scheme:dark;
}
html[data-night="1"][data-skin="bien"]{--bg:#121A26;--line:#22314A;--brand:#8EBCFF;--tabbg:rgba(18,26,38,.9)}
html[data-night="1"][data-skin="matcha"]{--bg:#121C17;--line:#21362B;--brand:#7EE0B5;--tabbg:rgba(18,28,23,.9)}
html[data-night="1"][data-skin="hoanghon"]{--bg:#1F1612;--line:#3A2A20;--brand:#FFB286;--tabbg:rgba(31,22,18,.9)}
html[data-night="1"][data-skin="oaihuong"]{--bg:#18142A;--line:#2D2547;--brand:#C4AFFF;--tabbg:rgba(24,20,42,.9)}
/* Bạn đồng hành */
.pal{display:flex;gap:12px;align-items:center;flex:1 1 260px;min-width:0}
.pal svg{flex:none;width:72px;height:72px}
.bubble{position:relative;background:var(--glass);border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:700;font-size:.9rem}
.lookbox{display:grid;gap:10px;padding:12px;border-radius:16px;background:var(--bg)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.08)}
/* Đếm ngược */
.cds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cd{background:var(--white);border-radius:16px;padding:12px;display:grid;gap:2px}
.cd b{font-family:var(--display);font-size:2rem;line-height:1;color:var(--cd);font-variant-numeric:tabular-nums}
.cd b small{font-size:.9rem;margin-left:4px}
.cd .nm{font-weight:800;overflow-wrap:anywhere}
.cd.soon{background:var(--white)}
.cd.soon b{color:var(--pink-d)}
.day .dots i.c{background:var(--lilac-d)}
/* Báo cáo */
.chart{position:relative;height:150px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;align-items:end;border-bottom:2px solid var(--line)}
.chart.m{gap:2px}
.chart .col{height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:default}
.chart .b{width:100%;max-width:30px;border-radius:4px 4px 0 0;background:var(--cd)}
.chart .col:hover .b{filter:brightness(1.08)}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.55;pointer-events:none}
.goalline span{position:absolute;right:0;top:-18px;font-size:.7rem;font-weight:800;color:var(--muted);background:var(--c);padding:0 4px;border-radius:6px}
.xl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;font-size:.7rem;color:var(--muted);text-align:center;font-weight:700}
.xl.m{gap:2px}
.rnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rnav h2{flex:1;min-width:0}
.moodrow{display:grid;grid-template-columns:28px 76px 1fr 28px;gap:8px;align-items:center;font-size:.85rem;font-weight:700}
.moodrow .bar{background:var(--glass)}
.moodrow .bar i{background:var(--cd)}
.delta{font-size:.8rem;font-weight:800}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;font-weight:700;padding:5px 9px;border-radius:9px;max-width:220px;opacity:0;transform:translate(-50%,-100%)}
#tip.show{opacity:1}
/* Nông trại */
.coin{width:18px;height:18px;vertical-align:-3px;margin-right:3px;flex:none}
.wallet{display:inline-flex;align-items:center;font-weight:800;background:var(--white);color:var(--lemon-d);padding:3px 10px;border-radius:99px;font-size:.9rem;font-variant-numeric:tabular-nums}
.purse{display:flex;align-items:center;gap:8px}
.purse .coin{width:40px;height:40px}
.purse b{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--lemon-d);font-variant-numeric:tabular-nums}
.purse span{font-weight:800;color:var(--muted)}

  function studiedToday(){ return (S.focus[today()] || {}).m || 0; }
  function computeCatMood(){
    var T = getT(), hr = new Date().getHours(), now = Date.now();
    if(T && T.mode === 'focus') return 'focus';
    if(T && T.mode === 'break') return 'happy';
    if(hr >= 23 || hr < 7) return 'sleepy';
    if(studiedToday() >= S.settings.studyGoal) return 'happy';
    var start = new Date(); start.setHours(7,0,0,0);
    var base = Math.max(start.getTime(), S.lastStudy || 0);
    var idle = (now - base)/60000, n = S.settings.nag || 60;
    if(S.lastStudy && now - S.lastStudy < 20*60000) return 'happy';
    if(idle >= n*2) return 'furious';
    if(idle >= n) return 'angry';
    if(idle >= n/2) return 'pouty';
    return 'calm';
  }
  function say(msg, nag){
    catMsg = msg; catShow = true; catNag = !!nag;
    clearTimeout(catHideT);
    if(!nag) catHideT = setTimeout(function(){ catShow = false; renderCat(); }, 7000);
    renderCat(true);
  }
  function renderCat(bounce){

    var bb0 = document.getElementById('bubble'); if(bb0 && catMsg) bb0.textContent = catMsg;
    if(box) box.remove(); return;
    if(!box){ box = document.createElement('div'); box.id = 'catbox'; document.body.appendChild(box); }
    var m = catMood || 'calm';
    box.className = 'catbox ' + m;
    box.innerHTML = (catShow ? '<div class="cbub" role="status"><p>' + esc(catMsg) + '</p>'
        + (catNag ? '<div class="row left"><button class="btn small primary" data-act="catStudy">Học ngay</button><button class="btn small" data-act="catSnooze">Cho mình 15 phút</button></div>' : '')
        + '</div>' : '')
      + '<button class="catbtn' + (bounce ? ' hop' : '') + '" data-act="catTap" aria-label="Mèo đốc học: ' + esc(catMsg || 'chạm để trò chuyện') + '">' + catSvg(m) + '</button>';
  }
  function catTick(){
    if(S.settings.cat !== 'on') return renderCat();
    var m = computeCatMood(), changed = m !== catMood;
    catMood = m; catPersist();
    var nagDue = (m === 'angry' || m === 'furious') && Date.now() > catSnooze;
    if(nagDue && !catNag) say(pick(CAT_MSG[m]), true);
    else if(changed && !catNag) say(pick(CAT_MSG[m]), false);

  }

    } else if(id === 'bedForm'){
      var bt = $('#bed').value; if(!bt) return;
      S.sleepPending = {bed: bt, at: Date.now()}; save(); render(); say('Chúc ngủ ngon! Sáng mai nhớ lưu giờ thức dậy nha.', false);
    } else if(id === 'wakeForm'){
      var wt = $('#wake').value; if(!wt || !S.sleepPending) return;
      S.sleep[today()] = {bed: S.sleepPending.bed, wake: wt}; delete S.sleepPending; save(); render(); say('Chào buổi sáng! Mèo đã ghi lại giấc ngủ rồi nè.', false);
    } else if(id === 'addEv'){
      v = $('#evTitle').value.trim(); if(!v) return;
      (S.events[selDay] = S.events[selDay] || []).push({id: uid('e'), time: $('#evTime').value || '', title: v});
      save(); render();
    } else if(id === 'setStudyGoal'){
      var g = Math.round(parseFloat(String($('#studyGoalIn').value).replace(',', '.'))*60); if(!g || g < 5) return;
      S.settings.studyGoal = Math.min(960, g); catMood = ''; save(); render(); catTick();
    } else if(id === 'setName' || id === 'setName2'){
      var nv = f.querySelector('.nmIn').value.trim().slice(0, 30); if(!nv) return;
      S.name = nv; save(); render();
    } else if(id === 'setRate'){
      var rv = parseInt($('#rateIn').value, 10); if(!rv || rv < 1000) return;
      S.wallet.rate = Math.min(10000000, rv); save(); render();
    } else if(id === 'setBudget'){
      S.budget = Math.max(0, parseInt($('#budgetIn').value, 10) || 0); save(); render();
    } else if(id === 'addTx'){
      var amt = parseInt($('#txAmt').value, 10); if(!amt || amt <= 0) return;
      var dt = $('#txDate').value || today();
      S.tx.push({id: uid('x'), d: dt, ts: Date.now(), type: txType, amt: amt, cat: txCat, note: $('#txNote').value.trim()});
      save(); render();
    } else if(id === 'addJar'){
      v = $('#jarName').value.trim(); var tg = parseInt($('#jarTarget').value, 10);
      if(!v || !tg) return;
      S.jars.push({id: uid('j'), name: v, target: tg, saved: 0}); save(); render();
    } else if(id === 'cls1Form'){
      var c1 = S.classes.filter(function(c){ return c.id === clsEdit1.id; })[0], nd = $('#c1Date').value;
      if(!c1 || !nd || !$('#c1Name').value.trim()) return;
      var r1 = {id: uid('c'), day: new Date(nd + 'T00:00:00').getDay(), room: $('#c1Room').value.trim(), name: $('#c1Name').value.trim(), lhp: c1.lhp || '', start: $('#c1Start').value, end: $('#c1End').value, gv: $('#c1Gv').value.trim(), mode: $('#c1Mode').value, from: nd, to: nd};
      if(c1.from === clsEdit1.d && c1.to === clsEdit1.d) S.classes = S.classes.filter(function(c){ return c !== c1; });
      else c1.skip = (c1.skip || []).concat([clsEdit1.d]);
      S.classes.push(r1); clsEdit1 = null; save(); render();
    } else if(id === 'clsForm'){
      var nm = $('#cName').value.trim(), cs = $('#cStart').value, ce = $('#cEnd').value; if(!nm || !cs || !ce) return;
      var dv = $('#cDay').value, rec = {day: dv === '' ? null : +dv, room: $('#cRoom').value.trim(), name: nm, lhp: $('#cLhp').value.trim(), start: cs, end: ce, gv: $('#cGv').value.trim(), mode: $('#cMode').value, from: $('#cFrom').value, to: $('#cTo').value};
      if(classEdit && classEdit !== 'new'){ var ex = S.classes.filter(function(c){ return c.id === classEdit; })[0]; if(ex) Object.assign(ex, rec); classEdit = null; }
      else if(classEdit === 'new'){ rec.id = uid('c'); S.classes.push(rec); classEdit = null; }
      else { rec.id = uid('c'); S.classes.push(rec); }
      save(); render();
    } else if(id === 'addTr'){
      v = $('#trName').value.trim(); if(!v) return;
      var tcv = Math.max(0, Math.min(20, parseInt($('#trTc').value, 10) || 0));
      S.transcript = S.transcript || []; S.transcript.push({id: uid('m'), code: '', name: v, tc: tcv}); save(); render();
    } else if(id === 'addCd'){
      v = $('#cdName').value.trim(); var cdD = $('#cdDate').value;
      if(!v || !cdD) return;
      S.countdowns.push({id: uid('c'), name: v, date: cdD}); save(); render();
    } else if(id === 'vNew'){
      var p1 = $('#vp1').value, p2 = $('#vp2').value;
      if(p1.length < 6){ vMsg = 'Mật khẩu cần ít nhất 6 ký tự.'; render(); return; }
      if(p1 !== p2){ vMsg = 'Hai lần nhập mật khẩu chưa giống nhau.'; render(); return; }
      var salt = crypto.getRandomValues(new Uint8Array(16));
      vBusy = true; render();
      derive(p1, salt).then(function(k){
        vKey = k; vData = {books: []}; S.vault = {salt: b64(salt)}; vMsg = ''; vBusy = false;
        return seal();
      });
    } else if(id === 'vOpen'){
      var pw = $('#vpw').value; if(!pw) return;
      vBusy = true; render();
      derive(pw, unb64(S.vault.salt)).then(function(k){
        return openWith(k).then(function(d){ vKey = k; vData = d; vMsg = ''; return remember(k); });
      }).catch(function(){ vMsg = 'Sai mật khẩu, bạn thử lại nhé.'; }).then(function(){ vBusy = false; render(); });
    } else if(id === 'bookAdd'){
      var bk = {id: uid('b'), bank: $('#bkBank').value.trim(), amt: parseInt($('#bkAmt').value, 10), rate: parseFloat($('#bkRate').value),
        start: $('#bkStart').value, end: $('#bkEnd').value, note: $('#bkNote').value.trim()};
      if(!bk.bank || !bk.amt || isNaN(bk.rate) || !bk.start || !bk.end) return;
      if(bk.end <= bk.start){ var er = $('#bkErr'); if(er) er.textContent = 'Ngày đáo hạn phải sau ngày gửi.'; return; }
      vData.books.push(bk); seal();
    } else if(f.classList.contains('jarform')){
      var j = S.jars.filter(function(x){ return x.id === f.dataset.j; })[0];
      var n = parseInt(f.querySelector('input').value, 10); if(!j || !n) return;
      var mode = e.submitter && e.submitter.dataset.mode === 'take' ? -1 : 1;
      j.saved = Math.max(0, j.saved + mode * n); save(); render();
    }
  });
  document.addEventListener('change', function(e){
    var el = e.target; if(!el.classList || !el.classList.contains('trScore')) return;
    var r = (S.transcript || []).filter(function(x){ return x.id === el.dataset.m; })[0]; if(!r) return;
    var raw = el.value.trim().replace(',', '.');
    if(!raw) delete r.score;
    else if(/^p$/i.test(raw)) r.score = 'P';
    else { var n = parseFloat(raw); if(isNaN(n) || n < 0 || n > 10){ el.value = hasScore(r) ? (r.score === 'P' ? 'P' : f1(r.score)) : ''; setStatus('Điểm phải từ 0 đến 10 (hoặc P).'); return; } r.score = Math.round(n*10)/10; }
    save(); render();
  });
  document.addEventListener('input', function(e){
    var j = e.target.dataset && e.target.dataset.j;
    if(j && e.target.tagName === 'TEXTAREA'){ draft[j] = e.target.value; lsSet(LD, {d: today(), v: draft}); }
  });

  lsSet(LTab, tab);
  render();
  setTimeout(catTick, 800);
  setInterval(catTick, 30000);
})();
</script>
</body>
</html>
